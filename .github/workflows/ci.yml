name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Debug info is the bulk of the cached target directory. Line tables keep
      # file:line in panic backtraces at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only the default branch writes cache entries: branch-scoped caches
          # are invisible to other branches, so saving from a PR costs quota
          # and helps nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tools
        run: mise install

      - name: Run CI checks
        run: mise run ci

  # `mise run ci:target` on the release targets `ci` does not cover, on the
  # runners `dist` builds them on (see the `plan` job's matrix in release.yml),
  # so a target-specific build failure shows up on the pull request instead of
  # in the tag-triggered release. `ci` above covers x86_64-unknown-linux-gnu.
  ci-target:
    name: ci-target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022

    env:
      # Debug info is the bulk of the cached target directory. Line tables keep
      # file:line in panic backtraces at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # `mise run` otherwise installs every tool in mise.toml before running a
      # task, undoing the narrow `install_args` below — and some of those tools
      # have no build for some of these platforms.
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only the default branch writes cache entries: branch-scoped caches
          # are invisible to other branches, so saving from a PR costs quota
          # and helps nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The action rather than the `mise.run` script, which has no Windows
      # install. Only the tools `ci:target` runs: the rest of mise.toml
      # (asciinema, agg, jj, ...) is unused here and not offered on every
      # platform.
      - name: Install mise and tools
        uses: jdx/mise-action@v5
        with:
          install_args: cargo-binstall cargo:cargo-nextest

      - name: Run target-dependent CI checks
        run: mise run ci:target

  # Separate from `ci` because the e2e suite needs a container runtime (it
  # drives stakk against a Forgejo instance), which `mise run ci` must not.
  # Docker is preinstalled on ubuntu-latest and the lifecycle script detects it.
  # No secrets are involved, so the job runs on fork pull requests too.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Debug info is the bulk of the cached target directory. Line tables keep
      # file:line in panic backtraces at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only the default branch writes cache entries: branch-scoped caches
          # are invisible to other branches, so saving from a PR costs quota
          # and helps nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tools
        run: mise install

      - name: Run e2e suite
        run: mise run e2e

      # `mise exec` puts uv (the script's interpreter) on PATH; a bare `run:`
      # line does not activate mise tools the way `mise run` does.
      - name: Collect Forgejo logs
        if: failure()
        run: mise exec -- scripts/e2e-forgejo.py logs > forgejo.log

      - name: Upload Forgejo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: forgejo-log
          path: forgejo.log

  # The flake is verified here and nowhere else. Separate from `ci` because it
  # shares nothing with the mise toolchain: nix builds the crate itself, from
  # its own pinned nixpkgs.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Saves the nixpkgs fetch, and skips the build entirely when the
      # derivation is unchanged. It cannot shorten the compile — see "Nix
      # packaging" in CLAUDE.md.
      - name: Cache the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # The derivation's source set, so a hit means a byte-identical build;
          # the prefix restore carries the toolchain between differing builds.
          primary-key: >-
            nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/package.nix',
            'Cargo.lock', 'Cargo.toml', 'build.rs', 'src/**', 'docs/**', '.config/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Only the default branch writes cache entries, as in the jobs above.
          save: ${{ github.ref == 'refs/heads/main' }}
          # Bounded so it cannot evict the other jobs' rust-cache entries.
          gc-max-store-size-linux: 3G

      # Builds `checks.<system>.stakk`, whose build runs the unit tests
      # (`cargo test --bins`; the e2e suite is the job above).
      # `--no-update-lock-file` makes a missing or stale `flake.lock` fail here
      # instead of being locked for the run.
      - name: Check flake
        run: nix flake check -L --no-update-lock-file

      - name: Build package
        run: nix build -L --no-update-lock-file .#stakk

      - name: Smoke-test the built binary
        run: ./result/bin/stakk --version
