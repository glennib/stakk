[tools]
uv = "0.12.24"
# No Windows build. Only `record-demo` uses it, which needs tmux anyway.
"github:asciinema/asciinema" = { version = "3.2.1", os = ["unix"] }
"github:asciinema/agg" = "1.9.0"
cargo-binstall = "1.25.2"
"cargo:cargo-dist" = "0.32.0"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-nextest" = "0.9.148"
"cargo:release-plz" = "0.3.170"
# From the GitHub releases rather than the default aqua registry entry, which
# lists no linux/arm64 build although the releases carry one.
"github:mitsuhiko/insta" = "latest"
# Pinned: `md:check` gates CI, so a new rumdl release must not fail the build
# out of nowhere.
rumdl = "0.2.78"
# Pinned exact so Renovate bumps it. CI has no jj otherwise, and the e2e suite
# drives the real binary; this tests the latest jj, not MIN_SUPPORTED_JJ_VERSION.
jj = "0.46.0"

[tasks.fmt]
description = "Format code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:nightly"]
description = "Format code with nightly"
run = "cargo +nightly fmt --all"

[tasks."fmt:check:nightly"]
description = "Check code formatting with nightly"
run = "cargo +nightly fmt --all -- --check"

[tasks."md"]
description = "Format Markdown"
run = "rumdl fmt ."

[tasks."md:check"]
description = "Check Markdown formatting"
run = "rumdl check ."

[tasks.clippy]
description = "Run clippy lints"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run tests"
run = "cargo nextest run --all-targets --no-tests=pass"

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks."build:debug"]
description = "Check that the project compiles"
run = "cargo build"

# `ring` is the only crypto provider (see `forge::forgejo::transport`). Checked
# for every target: `aws-lc-sys` builds on Linux CI but needs NASM on Windows,
# which only the release workflow builds for.
[tasks."deps:check"]
description = "Check that no second crypto/TLS provider is in the dependency tree"
run = """
set -e
tree=$(cargo tree --locked --target all --edges normal,build --prefix none --format '{p}')
banned=$(printf '%s\n' "$tree" | grep -E '^(aws-lc-rs|aws-lc-sys|openssl-sys) ' | sort -u || true)
if [ -n "$banned" ]; then
  printf 'error: banned crates in the dependency tree:\n%s\n' "$banned" >&2
  echo "see what pulls them in with: cargo tree --target all -e features -i <crate>" >&2
  exit 1
fi
"""

[tasks.ci]
description = "Run all CI checks"
depends = ["fmt:check", "md:check", "deps:check", "ci:target"]

# The part of `ci` whose outcome depends on the host target. CI runs it on every
# target `dist-workspace.toml` releases for; the rest of `ci` runs on Linux only.
# Plain commands only: on Windows mise runs tasks through `cmd`, not `sh`.
[tasks."ci:target"]
description = "Run the target-dependent CI checks (lints, tests, build)"
depends = ["clippy", "test", "build:debug"]

[tasks.record-demo]
description = "Re-record the README demo gif (resets the playground repo!)"
run = "scripts/record-demo.py"

[tasks."e2e:up"]
description = "Start the Forgejo instance for the e2e suite (idempotent)"
run = "scripts/e2e-forgejo.py up"

[tasks."e2e:down"]
description = "Remove the e2e Forgejo instance and its env file"
run = "scripts/e2e-forgejo.py down"

[tasks.e2e]
description = "Run the e2e suite against Forgejo (starts the instance if needed)"
run = "scripts/e2e-forgejo.py test"
